name: Lippi localization checks

on:
  pull_request:
    paths:
      - 'lippi/**'
      - '.github/workflows/lippi-i18n.yml'
  push:
    branches:
      - main
    paths:
      - 'lippi/**'
      - '.github/workflows/lippi-i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-localization:
    name: Lippi four-language source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lippi
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run localization smoke tests
        run: npm run test:i18n

  browser-localization:
    name: Lippi local desktop and mobile Chromium checks
    # Playwright 1.56 Chromium is supported on Ubuntu 24.04; latest is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lippi
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test six pages in four languages on desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lippi-http.log 2>&1 &
          npm run test:browser
